name: Platform release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to package (without leading v)
        required: true
        type: string
      mode:
        description: Dry-run validates and signs without publishing; publish creates the GitHub Release
        required: true
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run

permissions:
  contents: read

concurrency:
  group: platform-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    name: Build ${{ matrix.os }} application image
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable semantic version such as 1.2.8; got: $VERSION"
            exit 1
          fi
          echo "VANTA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build platform image and checksum (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon platformImageChecksum -PvantaVersion="$VANTA_VERSION"

      - name: Build platform image and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon platformImageChecksum "-PvantaVersion=$env:VANTA_VERSION"

      - name: Upload platform release assets
        uses: actions/upload-artifact@v4
        with:
          name: vanta-release-${{ runner.os }}-${{ runner.arch }}
          path: build/distributions/Vanta-*.zip*
          if-no-files-found: error
          retention-days: 7

  validate:
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    name: Validate and sign release (no publication)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted release tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag contains the pinned trust store
        if: github.event_name == 'push'
        shell: bash
        run: |
          git show "$GITHUB_SHA:src/main/resources/release-trusted-keys.json" > "$RUNNER_TEMP/tag-release-trusted-keys.json"
          cmp src/main/resources/release-trusted-keys.json "$RUNNER_TEMP/tag-release-trusted-keys.json"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned release tooling dependencies
        run: python -m pip install --disable-pip-version-check -r release/requirements.txt

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release version: $VERSION"
            exit 1
          fi
          echo "VANTA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: vanta-release-*
          path: release-assets
          merge-multiple: true

      - name: Generate and validate release manifest
        run: |
          python3 release/generate_manifest.py \
            --version "$VANTA_VERSION" \
            --channel stable \
            --assets-dir release-assets \
            --output release-assets/manifest.json

      - name: Sign release manifest
        env:
          VANTA_RELEASE_SIGNING_KEY: ${{ secrets.VANTA_RELEASE_SIGNING_KEY }}
        run: |
          python3 release/sign_manifest.py \
            --manifest release-assets/manifest.json \
            --output release-assets/manifest.sig \
            --key-id vanta-release-2026-01

      - name: Independently verify signed release manifest
        run: |
          python3 release/verify_manifest.py \
            --manifest release-assets/manifest.json \
            --signature release-assets/manifest.sig

      - name: Upload validated release bundle
        uses: actions/upload-artifact@v4
        with:
          name: vanta-validated-release-${{ env.VANTA_VERSION }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Report dry-run result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: |
          echo "Release validation and signature verification passed."
          echo "No GitHub Release, tag, or provenance attestation was created."
          echo "The validated bundle is available as the vanta-validated-release artifact."

  publish:
    if: ${{ needs.validate.result == 'success' && (github.event_name == 'push' || inputs.mode == 'publish') }}
    name: Attest and publish GitHub release
    needs: [build, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@v4
        with:
          name: vanta-validated-release-${{ needs.validate.outputs.version }}
          path: release-assets

      - name: Attest release packages, manifest and signature
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
