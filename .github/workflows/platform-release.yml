name: Platform release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to build and publish (without leading v)
        required: true
        type: string
      mode:
        description: Dry-run only validates; publish creates the version tag and public GitHub Release
        required: true
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run

permissions:
  contents: read

concurrency:
  group: platform-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    name: Build ${{ matrix.os }} application image
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable semantic version such as 1.2.8; got: $VERSION"
            exit 1
          fi
          echo "VANTA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build platform image and checksum (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon platformImageChecksum -PvantaVersion="$VANTA_VERSION"

      - name: Build platform image and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon platformImageChecksum "-PvantaVersion=$env:VANTA_VERSION"

      - name: Upload platform release assets
        uses: actions/upload-artifact@v4
        with:
          name: vanta-release-${{ runner.os }}-${{ runner.arch }}
          path: build/distributions/Vanta-*.zip*
          if-no-files-found: error
          retention-days: 7
      - name: Build legacy Windows ZIP and NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon updaterJarChecksum "-PvantaVersion=$env:VANTA_VERSION"
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'VantaLegacyStage'
          $assets = Join-Path $env:GITHUB_WORKSPACE 'legacy-assets'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $assets -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage, $assets -Force | Out-Null

          $image = Join-Path $env:GITHUB_WORKSPACE 'build/packages/Vanta'
          if (-not (Test-Path (Join-Path $image 'Vanta.exe') -PathType Leaf)) {
            throw "The Windows jpackage image is missing Vanta.exe."
          }
          Copy-Item (Join-Path $image '*') $stage -Recurse -Force
          $updater = @(Get-ChildItem 'build/updater/VantaUpdater-*.jar' -File)
          if ($updater.Count -ne 1) { throw "Expected exactly one standalone updater JAR." }
          $updaterDirectory = Join-Path $stage 'updater'
          New-Item -ItemType Directory -Path $updaterDirectory -Force | Out-Null
          Copy-Item $updater[0].FullName (Join-Path $updaterDirectory 'VantaUpdater.jar')

          # Preserve the exact archive name and root layout used by old launchers.
          $legacyZip = Join-Path $assets "Vanta-$env:VANTA_VERSION.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $legacyZip -CompressionLevel Optimal
          $legacyHash = (Get-FileHash -LiteralPath $legacyZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$legacyHash  Vanta-$env:VANTA_VERSION.zip" | Set-Content "$legacyZip.sha256" -NoNewline

          # Install the same pinned NSIS version used by the Windows validation
          # workflow. Avoid SourceForge mirror downloads, which can return
          # different payloads and fail archive checksum verification.
          choco install nsis --version=3.12 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS 3.12 installation failed with exit code $LASTEXITCODE." }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\\makensis.exe'
          if (-not (Test-Path $makensis -PathType Leaf)) { throw "NSIS 3.12 installation is missing makensis.exe: $makensis" }

          & $makensis "/DAPP_VERSION=$env:VANTA_VERSION" '.\VantaSetup.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer compilation failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path '.\VantaSetup.exe' -PathType Leaf)) { throw "NSIS did not produce VantaSetup.exe." }
          Copy-Item '.\VantaSetup.exe' $assets

          $archive = [System.IO.Compression.ZipFile]::OpenRead($legacyZip)
          try {
            $required = @('Vanta.exe', 'runtime/lib/modules', 'app/Vanta.cfg', 'updater/VantaUpdater.jar')
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\\','/') })
            foreach ($entry in $required) {
              if ($names -notcontains $entry) { throw "Legacy ZIP is missing required entry: $entry" }
            }
          } finally { $archive.Dispose() }
          Write-Host "Legacy Windows package and installer validated."

      - name: Upload legacy Windows compatibility assets
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vanta-legacy-windows
          path: legacy-assets/*
          if-no-files-found: error
          retention-days: 7

  updater:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    name: Build standalone updater JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable semantic version; got: $VERSION"
            exit 1
          fi
          echo "VANTA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build updater JAR and SHA-256 checksum
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon updaterJarChecksum -PvantaVersion="$VANTA_VERSION"

      - name: Upload standalone updater release asset
        uses: actions/upload-artifact@v4
        with:
          name: vanta-release-updater
          path: build/updater/VantaUpdater-*.jar*
          if-no-files-found: error
          retention-days: 7

  validate:
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    name: Validate and sign release (no publication)
    needs: [build, updater]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted release tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag contains the pinned trust store
        if: github.event_name == 'push'
        shell: bash
        run: |
          git show "$GITHUB_SHA:src/main/resources/release-trusted-keys.json" > "$RUNNER_TEMP/tag-release-trusted-keys.json"
          cmp src/main/resources/release-trusted-keys.json "$RUNNER_TEMP/tag-release-trusted-keys.json"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned release tooling dependencies
        run: python -m pip install --disable-pip-version-check -r release/requirements.txt

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release version: $VERSION"
            exit 1
          fi
          echo "VANTA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: vanta-release-*
          path: release-assets
          merge-multiple: true

      - name: Generate and validate release manifest
        run: |
          python3 release/generate_manifest.py \
            --version "$VANTA_VERSION" \
            --channel stable \
            --assets-dir release-assets \
            --output release-assets/manifest.json

      - name: Sign release manifest
        env:
          VANTA_RELEASE_SIGNING_KEY: ${{ secrets.VANTA_RELEASE_SIGNING_KEY }}
        run: |
          python3 release/sign_manifest.py \
            --manifest release-assets/manifest.json \
            --output release-assets/manifest.sig \
            --key-id vanta-release-2026-01

      - name: Independently verify signed release manifest
        run: |
          python3 release/verify_manifest.py \
            --manifest release-assets/manifest.json \
            --signature release-assets/manifest.sig
      - name: Add and verify legacy Windows compatibility assets
        uses: actions/download-artifact@v4
        with:
          name: vanta-legacy-windows
          path: release-assets

      - name: Validate legacy ZIP, checksum and installer
        shell: python
        run: |
          import hashlib
          import zipfile
          from pathlib import Path

          version = "${{ env.VANTA_VERSION }}"
          root = Path("release-assets")
          archive = root / f"Vanta-{version}.zip"
          checksum = root / f"Vanta-{version}.zip.sha256"
          installer = root / "VantaSetup.exe"
          for path in (archive, checksum, installer):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty legacy Windows release asset: {path.name}")
          fields = checksum.read_text(encoding="utf-8").strip().split()
          if len(fields) != 2 or fields[1].lstrip("*") != archive.name:
              raise SystemExit("Legacy ZIP checksum sidecar has an invalid filename.")
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != fields[0].lower():
              raise SystemExit("Legacy Windows ZIP SHA-256 checksum mismatch.")
          with zipfile.ZipFile(archive) as package:
              names = set(package.namelist())
              required = {"Vanta.exe", "runtime/lib/modules", "app/Vanta.cfg", "updater/VantaUpdater.jar"}
              missing = required - names
              if missing:
                  raise SystemExit("Legacy ZIP is missing: " + ", ".join(sorted(missing)))
              corrupt = package.testzip()
              if corrupt:
                  raise SystemExit(f"Legacy ZIP contains a corrupt entry: {corrupt}")
          print(f"Validated {archive.name}, its SHA-256 sidecar and {installer.name}.")

      - name: Upload validated release bundle
        uses: actions/upload-artifact@v4
        with:
          name: vanta-validated-release-${{ env.VANTA_VERSION }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Report dry-run result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: |
          echo "Release validation and signature verification passed."
          echo "No GitHub Release, tag, or provenance attestation was created."
          echo "The validated bundle is available as the vanta-validated-release artifact."

  publish:
    if: ${{ needs.validate.result == 'success' && (github.event_name == 'push' || inputs.mode == 'publish') }}
    name: Attest and publish GitHub release
    needs: [build, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@v4
        with:
          name: vanta-validated-release-${{ needs.validate.outputs.version }}
          path: release-assets

      - name: Attest release packages, manifest and signature
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
