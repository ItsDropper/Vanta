name: Platform release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to package (without leading v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }} application image
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version such as 1.2.8; got: $VERSION"
            exit 1
          fi
          echo "VANTA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build platform image and checksum (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon platformImageChecksum -PvantaVersion="$VANTA_VERSION"

      - name: Build platform image and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon platformImageChecksum "-PvantaVersion=$env:VANTA_VERSION"

      - name: Upload platform release assets
        uses: actions/upload-artifact@v4
        with:
          name: vanta-release-${{ runner.os }}-${{ runner.arch }}
          path: build/distributions/Vanta-*.zip*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Generate manifest and publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned release tooling dependencies
        run: python -m pip install --disable-pip-version-check -r release/requirements.txt

      - name: Resolve release metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION="${VERSION#v}"
          echo "VANTA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: vanta-release-*
          path: release-assets
          merge-multiple: true

      - name: Generate and validate release manifest
        run: |
          python3 release/generate_manifest.py \
            --version "$VANTA_VERSION" \
            --channel stable \
            --assets-dir release-assets \
            --output release-assets/manifest.json

      - name: Attest release packages and manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
