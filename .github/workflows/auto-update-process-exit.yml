name: Auto-update process exit regression

on:
  pull_request:
    paths:
      - 'src/main/java/dev/itsdropper/vanta/launcher/update/**'
      - 'src/main/java/dev/itsdropper/vanta/ui/LauncherView.java'
      - 'src/test/java/dev/itsdropper/vanta/launcher/update/**'
      - 'build.gradle'
      - '.github/workflows/auto-update-process-exit.yml'
  push:
    branches:
      - main
      - 'fix/auto-update-guaranteed-shutdown'
    paths:
      - 'src/main/java/dev/itsdropper/vanta/launcher/update/**'
      - 'src/main/java/dev/itsdropper/vanta/ui/LauncherView.java'
      - 'src/test/java/dev/itsdropper/vanta/launcher/update/**'
      - 'build.gradle'
      - '.github/workflows/auto-update-process-exit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-process-exit:
    name: Updater process exit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run updater process-exit regression test
        if: runner.os != 'Windows'
        run: bash gradlew --no-daemon test

      - name: Run updater process-exit regression test
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon test
