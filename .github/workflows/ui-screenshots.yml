name: UI screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install JavaFX display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0 libxtst6 libxi6 libxrender1 libxrandr2 libxinerama1 libxxf86vm1 libgl1
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run regression tests
        run: ./gradlew test
      - name: Capture sidebar and additional production views
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/vanta-data
          JAVA_TOOL_OPTIONS: -Dprism.order=sw -Djava.awt.headless=false
        run: |
          mkdir -p "$XDG_DATA_HOME"
          xvfb-run -a -s "-screen 0 1600x1000x24" ./gradlew run --args="--capture-ui-screenshots build/ui-screenshots"
          screenshots=(build/ui-screenshots/[0-9][0-9]-*.png)
          test "${#screenshots[@]}" -eq 9
          test -s build/ui-screenshots/index.md
          test -s build/ui-screenshots/overview.png
          for screenshot in "${screenshots[@]}"; do
            test -s "$screenshot"
            test "$(stat -c%s "$screenshot")" -gt 12000
          done
          test "$(sha256sum "${screenshots[@]}" | awk '{print $1}' | sort -u | wc -l)" -eq 9
          additional_screenshots=(build/ui-screenshots/additional/[0-9][0-9]-*.png)
          test "${#additional_screenshots[@]}" -eq 13
          test -s build/ui-screenshots/additional/index.md
          test -s build/ui-screenshots/additional/overview.png
          for screenshot in "${additional_screenshots[@]}"; do
            test -s "$screenshot"
            test "$(stat -c%s "$screenshot")" -gt 12000
          done
          test "$(sha256sum "${additional_screenshots[@]}" | awk '{print $1}' | sort -u | wc -l)" -eq 13
          python3 - <<'PY'
          from pathlib import Path
          import struct

          groups = [
              (Path("build/ui-screenshots"), 9),
              (Path("build/ui-screenshots/additional"), 13),
          ]
          for directory, expected_count in groups:
              files = sorted(directory.glob("[0-9][0-9]-*.png"))
              if len(files) != expected_count:
                  raise SystemExit(
                      f"{directory}: expected {expected_count} screenshots, found {len(files)}"
                  )
              for path in files:
                  header = path.read_bytes()[:24]
                  if header[:8] != b"\x89PNG\r\n\x1a\n":
                      raise SystemExit(f"{path.name} is not a PNG")
                  width, height = struct.unpack(">II", header[16:24])
                  if (width, height) != (1440, 900):
                      raise SystemExit(f"{path.name}: expected 1440x900, got {width}x{height}")
          PY
      - name: Publish screenshots and capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanta-ui-screenshots
          path: build/ui-screenshots/
          if-no-files-found: warn
          retention-days: 14
