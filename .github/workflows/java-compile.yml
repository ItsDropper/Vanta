name: Cross-platform Java checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} — tests and distributions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run tests and build portable distributions (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew test distZip distTar platformImageChecksum
      - name: Run tests and build portable distributions (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat test distZip distTar platformImageChecksum
      - name: Verify Windows application image layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem 'build/packages/Vanta' -Force
          Get-ChildItem 'build/packages/Vanta/runtime/bin' -Force
          if (!(Test-Path 'build/packages/Vanta/Vanta.exe')) { throw 'Missing Windows launcher' }
          if (!(Test-Path 'build/packages/Vanta/runtime/bin/java.exe') -and !(Test-Path 'build/packages/Vanta/runtime/bin/javaw.exe')) { throw 'Missing bundled Windows Java launcher' }
          if (!(Test-Path 'build/packages/Vanta/app/updater/VantaUpdater.jar')) { throw 'Missing external updater JAR' }
      - name: Verify Linux application image layout
        if: runner.os == 'Linux'
        run: |
          for file in build/packages/Vanta/bin/Vanta build/packages/Vanta/lib/runtime/bin/java; do
            if [ ! -x "$file" ]; then
              echo "Missing or non-executable app image file: $file"
              ls -la "$(dirname "$file")" || true
              find build/packages/Vanta -maxdepth 5 -name "$(basename "$file")" -print
              exit 1
            fi
          done
          if [ ! -f build/packages/Vanta/lib/app/updater/VantaUpdater.jar ]; then
            echo "Missing external updater JAR"
            ls -la build/packages/Vanta/lib/app || true
            exit 1
          fi
      - name: Verify macOS application bundle layout
        if: runner.os == 'macOS'
        run: |
          test -x build/packages/Vanta.app/Contents/MacOS/Vanta
          test -d build/packages/Vanta.app/Contents/app
          JAVA_BIN=""
          for candidate in build/packages/Vanta.app/Contents/runtime/bin/java build/packages/Vanta.app/Contents/runtime/Contents/Home/bin/java; do
            if [ -x "$candidate" ]; then JAVA_BIN="$candidate"; break; fi
          done
          if [ -z "$JAVA_BIN" ]; then
            echo "Missing executable Java in macOS runtime bundle"
            find build/packages/Vanta.app/Contents/runtime -name java -print
            exit 1
          fi
          test -f build/packages/Vanta.app/Contents/app/updater/VantaUpdater.jar
      - name: Smoke test Linux application image
        if: runner.os == 'Linux' && runner.arch == 'X64'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/vanta-appimage-data
          JAVA_TOOL_OPTIONS: -Dprism.order=sw -Djava.awt.headless=false
        run: |
          mkdir -p "$XDG_DATA_HOME"
          xvfb-run -a build/packages/Vanta/bin/Vanta --capture-sidebar-screenshots build/app-image-smoke
          screenshots=(build/app-image-smoke/[0-9][0-9]-*.png)
          test "${#screenshots[@]}" -eq 9
          test -s build/app-image-smoke/index.md
          test -s build/app-image-smoke/overview.png
      - name: Upload platform distributions
        uses: actions/upload-artifact@v4
        with:
          name: vanta-distribution-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/distributions/*
            build/packages/*
          if-no-files-found: error
          retention-days: 14
