name: Cross-platform Java checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} — tests and distributions
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests and build portable distributions (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew test distZip distTar platformImageChecksum

      - name: Run tests and build portable distributions (Windows)
        if: runner.os == 'Windows'
        run: .\\gradlew.bat test distZip distTar platformImageChecksum

      - name: Verify Windows application image layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $image = 'build/packages/Vanta'
          if (!(Test-Path "$image/Vanta.exe")) { throw 'Missing Windows native launcher' }
          if (!(Test-Path "$image/runtime/bin/java.dll")) { throw 'Missing Windows JVM runtime library' }
          if (!(Test-Path "$image/runtime/lib/modules")) { throw 'Missing Windows runtime modules' }
          if (!(Test-Path "$image/app/Vanta.cfg")) { throw 'Missing Windows application configuration' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Get-ChildItem 'build/distributions/Vanta-*-windows-x64.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'Missing Windows update archive' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entries = $zip.Entries.FullName
            if (!($entries | Where-Object { $_ -eq 'Vanta.exe' -or $_ -like '*/Vanta.exe' })) {
              throw 'Windows update archive does not contain the native launcher'
            }
            if (!($entries | Where-Object { $_ -like '*/runtime/lib/modules' })) {
              throw 'Windows update archive does not contain the bundled runtime'
            }
          } finally {
            $zip.Dispose()
          }

      - name: Verify Linux application image layout
        if: runner.os == 'Linux'
        run: |
          test -x build/packages/Vanta/bin/Vanta
          test -f build/packages/Vanta/lib/runtime/lib/modules
          test -f build/packages/Vanta/lib/app/Vanta.cfg
          ARCHIVE="$(find build/distributions -maxdepth 1 -name 'Vanta-*-linux-*.zip' -print -quit)"
          test -n "$ARCHIVE"
          unzip -Z1 "$ARCHIVE" > build/distributions/archive-entries.txt
          grep -Eq '(^|/)bin/Vanta$' build/distributions/archive-entries.txt
          grep -Eq '(^|/)lib/runtime/lib/modules$' build/distributions/archive-entries.txt

      - name: Verify macOS application bundle layout
        if: runner.os == 'macOS'
        run: |
          test -x build/packages/Vanta.app/Contents/MacOS/Vanta
          test -d build/packages/Vanta.app/Contents/app
          RUNTIME_MODULES="$(find build/packages/Vanta.app/Contents/runtime -path '*/lib/modules' -print -quit)"
          test -n "$RUNTIME_MODULES"
          test -f build/packages/Vanta.app/Contents/app/Vanta.cfg
          ARCHIVE="$(find build/distributions -maxdepth 1 -name 'Vanta-*-macos-*.zip' -print -quit)"
          test -n "$ARCHIVE"
          unzip -Z1 "$ARCHIVE" > build/distributions/archive-entries.txt
          grep -Eq '(^|/)Contents/MacOS/Vanta$' build/distributions/archive-entries.txt
          grep -Eq '(^|/)Contents/app/Vanta.cfg$' build/distributions/archive-entries.txt

      - name: Smoke test Linux application image
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/vanta-appimage-data
          JAVA_TOOL_OPTIONS: -Dprism.order=sw -Djava.awt.headless=false
        run: |
          mkdir -p "$XDG_DATA_HOME"
          xvfb-run -a build/packages/Vanta/bin/Vanta --capture-sidebar-screenshots build/app-image-smoke
          screenshots=(build/app-image-smoke/[0-9][0-9]-*.png)
          test "${#screenshots[@]}" -eq 9
          test -s build/app-image-smoke/index.md
          test -s build/app-image-smoke/overview.png

      - name: Smoke test Windows application image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'vanta-windows-smoke'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $env:JAVA_TOOL_OPTIONS = '-Dprism.order=sw -Djava.awt.headless=false'
          $process = Start-Process -FilePath 'build/packages/Vanta/Vanta.exe' `
            -ArgumentList '--capture-sidebar-screenshots', 'build/app-image-smoke' -PassThru
          if (!$process.WaitForExit(90000)) {
            $process.Kill()
            throw 'Vanta screenshot smoke test timed out after 90 seconds'
          }
          if ($process.ExitCode -ne 0) { throw "Vanta exited with code $($process.ExitCode)" }
          $screenshots = Get-ChildItem 'build/app-image-smoke/[0-9][0-9]-*.png' -ErrorAction SilentlyContinue
          if ($screenshots.Count -ne 9) { throw "Expected 9 screenshots, found $($screenshots.Count)" }
          if (!(Test-Path 'build/app-image-smoke/index.md')) { throw 'Missing screenshot index' }
          if (!(Test-Path 'build/app-image-smoke/overview.png')) { throw 'Missing screenshot overview' }

      - name: Smoke test macOS application bundle
        if: runner.os == 'macOS'
        env:
          JAVA_TOOL_OPTIONS: -Dprism.order=sw -Djava.awt.headless=false
        run: |
          export HOME="$RUNNER_TEMP/vanta-macos-home"
          mkdir -p "$HOME"
          build/packages/Vanta.app/Contents/MacOS/Vanta --capture-sidebar-screenshots build/app-image-smoke
          screenshots=(build/app-image-smoke/[0-9][0-9]-*.png)
          test "${#screenshots[@]}" -eq 9
          test -s build/app-image-smoke/index.md
          test -s build/app-image-smoke/overview.png

      - name: Upload platform distributions
        uses: actions/upload-artifact@v4
        with:
          name: vanta-distribution-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/distributions/*
            build/packages/*
          if-no-files-found: error
          retention-days: 14


  windows-arm64-emulation:
    name: Windows 11 ARM64 — x64 emulation
    runs-on: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up x64 Java 21 for Windows emulation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          cache: gradle

      - name: Run tests and build x64 application image
        shell: pwsh
        run: .\\gradlew.bat test platformImageChecksum

      - name: Verify emulated x64 application image
        shell: pwsh
        run: |
          $image = 'build/packages/Vanta'
          if (!(Test-Path "$image/Vanta.exe")) { throw 'Missing x64 Windows launcher' }
          if (!(Test-Path "$image/runtime/bin/java.dll")) { throw 'Missing x64 JVM runtime library' }
          if (!(Test-Path "$image/runtime/lib/modules")) { throw 'Missing bundled runtime modules' }
          if (!(Test-Path "$image/app/Vanta.cfg")) { throw 'Missing application configuration' }
          $nativeArch = $env:PROCESSOR_ARCHITEW6432
          if (!$nativeArch) { $nativeArch = $env:PROCESSOR_ARCHITECTURE }
          if ($nativeArch -ne 'ARM64') {
            throw "Expected native ARM64 runner, got $nativeArch"
          }
          $javaProperties = & java -XshowSettings:properties -version 2>&1 | Out-String
          if ($javaProperties -notmatch 'os\.arch\s*=\s*(amd64|x86_64)') {
            throw 'The test JVM is not running as x64 under emulation'
          }

      - name: Smoke test emulated Windows application image
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'vanta-arm64-smoke'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          & build/packages/Vanta/Vanta.exe --capture-sidebar-screenshots build/app-image-smoke
          if ($LASTEXITCODE -ne 0) { throw "Vanta exited with code $LASTEXITCODE" }
          $screenshots = Get-ChildItem 'build/app-image-smoke/[0-9][0-9]-*.png' -ErrorAction SilentlyContinue
          if ($screenshots.Count -ne 9) { throw "Expected 9 screenshots, found $($screenshots.Count)" }
          if (!(Test-Path 'build/app-image-smoke/index.md')) { throw 'Missing screenshot index' }
          if (!(Test-Path 'build/app-image-smoke/overview.png')) { throw 'Missing screenshot overview' }

      - name: Upload Windows ARM64 emulation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanta-windows-arm64-x64-emulation
          path: |
            build/distributions/*
            build/packages/*
            build/app-image-smoke/*
          if-no-files-found: error
          retention-days: 14

  linux-distribution-smoke:
    name: Linux desktop smoke — ${{ matrix.distro }}
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 22.04
            image: ubuntu:22.04
          - distro: Debian 12
            image: debian:12
          - distro: Fedora (current)
            image: fedora:latest
          - distro: Arch Linux
            image: archlinux:latest
    steps:
      - name: Download Linux x64 application image
        uses: actions/download-artifact@v4
        with:
          name: vanta-distribution-Linux-X64
          path: linux-x64-artifact

      - name: Launch packaged application on target distribution
        env:
          DISTRO: ${{ matrix.distro }}
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            -e VANTA_DISTRO="$DISTRO" \
            -v "$PWD/linux-x64-artifact:/artifact:ro" \
            "$DISTRO_IMAGE" bash -s <<'CONTAINER'
          set -euo pipefail

          case "$VANTA_DISTRO" in
            "Ubuntu 22.04"|"Debian 12")
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                xvfb libgtk-3-0 libxtst6 libxi6 libxrender1 libxrandr2 \
                libxinerama1 libxxf86vm1 libgl1 libasound2 libxkbcommon0 \
                libfontconfig1 libfreetype6 libcups2
              ;;
            "Fedora (current)")
              dnf install -y \
                xorg-x11-server-Xvfb gtk3 libXtst libXi libXrender libXrandr \
                libXinerama libXxf86vm mesa-libGL alsa-lib libxkbcommon \
                fontconfig freetype cups-libs
              ;;
            "Arch Linux")
              pacman -Syu --noconfirm --needed \
                xorg-server-xvfb gtk3 libxtst libxi libxrender libxrandr \
                libxinerama libxxf86vm mesa libglvnd alsa-lib libxkbcommon \
                fontconfig freetype2 libcups
              ;;
            *)
              echo "Unknown Linux distribution: $VANTA_DISTRO"
              exit 2
              ;;
          esac

          APP=/artifact/packages/Vanta
          test -x "$APP/bin/Vanta"
          test -f "$APP/lib/runtime/lib/modules"

          mkdir -p /tmp/vanta-home /tmp/vanta-xdg-data
          export HOME=/tmp/vanta-home
          export XDG_DATA_HOME=/tmp/vanta-xdg-data
          export DISPLAY=:99
          export JAVA_TOOL_OPTIONS="-Dprism.order=sw -Djava.awt.headless=false"

          Xvfb :99 -screen 0 1600x1000x24 >/tmp/vanta-xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2

          "$APP/bin/Vanta" --capture-sidebar-screenshots /tmp/vanta-distro-smoke
          screenshots=(/tmp/vanta-distro-smoke/[0-9][0-9]-*.png)
          test "${#screenshots[@]}" -eq 9
          test -s /tmp/vanta-distro-smoke/index.md
          test -s /tmp/vanta-distro-smoke/overview.png
          CONTAINER
