name: Cross-platform Java checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} — tests and distributions
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release manifest tooling (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python3 -m pip install --disable-pip-version-check -r release/requirements.txt -r release/bootstrap-requirements.txt
          python3 -m py_compile release/generate_manifest.py release/test_generate_manifest.py release/sign_manifest.py release/verify_manifest.py release/generate_signing_key.py release/test_sign_manifest.py release/bootstrap_signing_key.py
          python3 release/test_generate_manifest.py
          python3 release/test_sign_manifest.py
          python3 -c "import json; json.load(open('release/manifest.schema.json', encoding='utf-8'))"

      - name: Validate release manifest tooling (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r release/requirements.txt -r release/bootstrap-requirements.txt
          python -m py_compile release/generate_manifest.py release/test_generate_manifest.py release/sign_manifest.py release/verify_manifest.py release/generate_signing_key.py release/test_sign_manifest.py release/bootstrap_signing_key.py
          python release/test_generate_manifest.py
          python release/test_sign_manifest.py
          python -c "import json; json.load(open('release/manifest.schema.json', encoding='utf-8'))"


      - name: Run tests and build portable distributions (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew test distZip distTar platformImageChecksum updaterJarChecksum

      - name: Run tests and build portable distributions (Windows)
        if: runner.os == 'Windows'
        run: .\\gradlew.bat test distZip distTar platformImageChecksum updaterJarChecksum

      - name: Report runtime and application image footprint (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./gradlew runtimeFootprint

      - name: Report runtime and application image footprint (Windows)
        if: runner.os == 'Windows'
        run: .\\gradlew.bat runtimeFootprint

      - name: Verify Windows application image layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $image = 'build/packages/Vanta'
          if (!(Test-Path "$image/Vanta.exe")) { throw 'Missing Windows native launcher' }
          if (!(Test-Path "$image/runtime/bin/java.dll")) { throw 'Missing Windows JVM runtime library' }
          if (!(Test-Path "$image/runtime/lib/modules")) { throw 'Missing Windows runtime modules' }
          if (!(Test-Path "$image/app/Vanta.cfg")) { throw 'Missing Windows application configuration' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Get-ChildItem 'build/distributions/Vanta-*-windows-x64.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'Missing Windows update archive' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entries = $zip.Entries.FullName
            if (!($entries | Where-Object { $_ -eq 'Vanta.exe' -or $_ -like '*/Vanta.exe' })) {
              throw 'Windows update archive does not contain the native launcher'
            }
            $runtimeEntry = $entries | Where-Object {
              $_ -eq 'runtime/lib/modules' -or $_ -like '*/runtime/lib/modules'
            } | Select-Object -First 1
            if (!$runtimeEntry) {
              $entries | Where-Object { $_ -match 'runtime|modules' } | Write-Host
              throw 'Windows update archive does not contain the bundled runtime'
            }
          } finally {
            $zip.Dispose()
          }

      - name: Compile NSIS installer and test checksum verifier
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --version=3.12 --yes --no-progress
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path $makensis -PathType Leaf)) { throw 'NSIS 3.12 was not installed.' }
          & $makensis '/DAPP_VERSION=1.0.0' '.\VantaSetup.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS compilation failed: $LASTEXITCODE" }
          if (!(Test-Path '.\VantaSetup.exe' -PathType Leaf)) { throw 'Installer output is missing.' }

          $testDirectory = Join-Path $env:RUNNER_TEMP 'vanta-checksum-test'
          New-Item -ItemType Directory -Path $testDirectory -Force | Out-Null
          $testArchive = Join-Path $testDirectory 'Vanta-test.zip'
          Set-Content -LiteralPath $testArchive -Value 'valid fixture' -NoNewline
          $hash = (Get-FileHash -LiteralPath $testArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$testArchive.sha256" -Value "$hash  Vanta-test.zip" -NoNewline
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'release/verify_installer_checksum.ps1' -Archive $testArchive -Checksum "$testArchive.sha256"
          if ($LASTEXITCODE -ne 0) { throw 'Checksum verifier rejected a valid sidecar.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'release/verify_installer_checksum.ps1' -Archive $testArchive -ExpectedSha256 $hash
          if ($LASTEXITCODE -ne 0) { throw 'Checksum verifier rejected a valid GitHub asset digest.' }
          $expectedDigestFile = Join-Path $testDirectory 'expected-sha256.txt'
          $verificationLog = Join-Path $testDirectory 'installer.log'
          Set-Content -LiteralPath $expectedDigestFile -Value $hash -NoNewline
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'release/verify_installer_checksum.ps1' -Archive $testArchive -ExpectedSha256File $expectedDigestFile -LogPath $verificationLog
          if ($LASTEXITCODE -ne 0) { throw 'Checksum verifier rejected a valid digest file.' }
          if ((Get-Content -LiteralPath $verificationLog -Raw) -notmatch [regex]::Escape($hash)) {
            throw 'Checksum verifier did not record its successful digest in the installer log.'
          }
          Set-Content -LiteralPath $testArchive -Value 'tampered fixture' -NoNewline
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'release/verify_installer_checksum.ps1' -Archive $testArchive -ExpectedSha256File $expectedDigestFile -LogPath $verificationLog 2>$null
          $fileDigestNegativeExitCode = $LASTEXITCODE
          if ($fileDigestNegativeExitCode -eq 0) { throw 'Checksum verifier accepted a modified archive using a digest file.' }
          $diagnostics = Get-Content -LiteralPath $verificationLog -Raw
          if ($diagnostics -notmatch 'expected:' -or $diagnostics -notmatch 'actual:') {
            throw 'Checksum verifier did not log expected and actual hashes after a mismatch.'
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'release/verify_installer_checksum.ps1' -Archive $testArchive -Checksum "$testArchive.sha256" 2>$null
          $negativeExitCode = $LASTEXITCODE
          if ($negativeExitCode -eq 0) { throw 'Checksum verifier accepted a modified archive using a sidecar.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'release/verify_installer_checksum.ps1' -Archive $testArchive -ExpectedSha256 $hash 2>$null
          $digestNegativeExitCode = $LASTEXITCODE
          if ($digestNegativeExitCode -eq 0) { throw 'Checksum verifier accepted a modified archive using a GitHub asset digest.' }
          # The negative test must fail, but that expected native exit code must
          # not become the exit code of this otherwise-successful PowerShell step.
          $global:LASTEXITCODE = 0
          Remove-Item $testDirectory -Recurse -Force
          Write-Host 'NSIS installer compiled and checksum verifier passed positive/negative tests.'

      - name: Smoke test the actual Windows installer and uninstaller
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP 'vanta-installer-version-test'
          New-Item -ItemType Directory -Path $fixtureDirectory -Force | Out-Null
          $metadata = Join-Path $fixtureDirectory 'release.json'
          $versionPath = Join-Path $fixtureDirectory 'version.txt'
          $digestPath = Join-Path $fixtureDirectory 'expected-sha256.txt'
          $fixtureDigest = '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          $metadataJson = @{
            tag_name = 'v1.2.3'
            assets = @(@{ name = 'Vanta-1.2.3.zip'; digest = "sha256:$fixtureDigest" })
          } | ConvertTo-Json -Depth 4 -Compress
          Set-Content -LiteralPath $metadata -Value $metadataJson -NoNewline
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'release/read_latest_release_version.ps1' -ReleaseMetadata $metadata -OutputPath $versionPath -ChecksumOutputPath $digestPath
          if ($LASTEXITCODE -ne 0 -or (Get-Content -LiteralPath $versionPath -Raw) -ne '1.2.3') {
            throw 'Installer release-version parser failed its valid-tag test.'
          }
          if ((Get-Content -LiteralPath $digestPath -Raw) -ne $fixtureDigest) {
            throw 'Installer release-version parser did not extract the matching GitHub asset digest.'
          }
          Set-Content -LiteralPath $metadata -Value '{"tag_name":"v1.2.3/../../bad"}' -NoNewline
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'release/read_latest_release_version.ps1' -ReleaseMetadata $metadata -OutputPath $versionPath -ChecksumOutputPath $digestPath 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Installer release-version parser accepted an invalid tag.' }
          $global:LASTEXITCODE = 0

          $installDirectory = Join-Path $env:LOCALAPPDATA 'Vanta'
          if (Test-Path $installDirectory) {
            throw "Unexpected pre-existing Vanta installation in clean runner: $installDirectory"
          }
          $installer = (Resolve-Path '.\VantaSetup.exe').Path
          Write-Host 'Running the real bootstrap installer in silent mode...'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', '/LOG', "/D=$installDirectory") -PassThru
          if (!$install.WaitForExit(360000)) {
            $install.Kill()
            throw 'Vanta installer did not finish within six minutes.'
          }
          if ($install.ExitCode -ne 0) {
            $installerLog = Join-Path $env:TEMP 'VantaInstaller.log'
            $details = if (Test-Path $installerLog) { (Get-Content $installerLog -Tail 100) -join "\n" } else { 'NSIS did not produce its installer log.' }
            throw "Vanta installer exited with code $($install.ExitCode). $details"
          }
          foreach ($required in @('Vanta.exe', 'runtime/lib/modules', 'app/Vanta.cfg', 'updater/VantaUpdater.jar', 'Uninstall.exe')) {
            if (!(Test-Path (Join-Path $installDirectory $required) -PathType Leaf)) {
              throw "Installed Vanta package is missing $required."
            }
          }

          Write-Host 'Running the installed uninstaller...'
          $uninstaller = Join-Path $installDirectory 'Uninstall.exe'
          $uninstallerLog = Join-Path $env:RUNNER_TEMP 'vanta-uninstaller.log'
          # NSIS uninstallers require _?=<install-dir> as the final argument
          # when launched silently. It initializes $INSTDIR without relying
          # on registry discovery or the process working directory.
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/S', "_?=$installDirectory") -PassThru
          if (!$uninstall.WaitForExit(360000)) {
            $uninstall.Kill()
            throw 'Vanta uninstaller did not finish within six minutes.'
          }
          if ($uninstall.ExitCode -ne 0) {
            $details = if (Test-Path $uninstallerLog) { Get-Content -LiteralPath $uninstallerLog -Raw } else { 'NSIS did not produce an uninstaller log.' }
            throw "Vanta uninstaller exited with code $($uninstall.ExitCode). $details"
          }
          $scriptUninstallerLog = Join-Path $env:TEMP 'VantaUninstaller.log'
          # NSIS may delegate self-deletion to a helper process after the
          # uninstaller process exits. Allow that cleanup to finish.
          $cleanupDeadline = [DateTime]::UtcNow.AddSeconds(15)
          while ((Test-Path $installDirectory) -and [DateTime]::UtcNow -lt $cleanupDeadline) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installDirectory) {
            Write-Host 'NSIS runtime log:'
            if (Test-Path $uninstallerLog) { Get-Content -LiteralPath $uninstallerLog | Write-Host }
            Write-Host 'Vanta uninstaller section log:'
            if (Test-Path $scriptUninstallerLog) { Get-Content -LiteralPath $scriptUninstallerLog | Write-Host }
            else { Write-Host "Uninstaller section did not create $scriptUninstallerLog" }
            Write-Host 'Remaining installation contents:'
            Get-ChildItem -LiteralPath $installDirectory -Force -Recurse -ErrorAction Continue |
              Select-Object FullName, Length, Attributes |
              Format-Table -AutoSize | Out-String | Write-Host
            throw 'Vanta uninstaller left the installation directory behind.'
          }
          Remove-Item $fixtureDirectory -Recurse -Force
          Write-Host 'Windows installer and uninstaller end-to-end smoke test passed.'

      - name: Verify Linux application image layout
        if: runner.os == 'Linux'
        run: |
          test -x build/packages/Vanta/bin/Vanta
          test -f build/packages/Vanta/lib/runtime/lib/modules
          test -f build/packages/Vanta/lib/app/Vanta.cfg
          ARCHIVE="$(find build/distributions -maxdepth 1 -name 'Vanta-*-linux-*.zip' -print -quit)"
          test -n "$ARCHIVE"
          unzip -Z1 "$ARCHIVE" > build/distributions/archive-entries.txt
          grep -Eq '(^|/)bin/Vanta$' build/distributions/archive-entries.txt
          grep -Eq '(^|/)lib/runtime/lib/modules$' build/distributions/archive-entries.txt

      - name: Verify macOS application bundle layout
        if: runner.os == 'macOS'
        run: |
          test -x build/packages/Vanta.app/Contents/MacOS/Vanta
          test -d build/packages/Vanta.app/Contents/app
          RUNTIME_MODULES="$(find build/packages/Vanta.app/Contents/runtime -path '*/lib/modules' -print -quit)"
          test -n "$RUNTIME_MODULES"
          test -f build/packages/Vanta.app/Contents/app/Vanta.cfg
          ARCHIVE="$(find build/distributions -maxdepth 1 -name 'Vanta-*-macos-*.zip' -print -quit)"
          test -n "$ARCHIVE"
          unzip -Z1 "$ARCHIVE" > build/distributions/archive-entries.txt
          grep -Eq '(^|/)Contents/MacOS/Vanta$' build/distributions/archive-entries.txt
          grep -Eq '(^|/)Contents/app/Vanta.cfg$' build/distributions/archive-entries.txt

      - name: Smoke test Linux application image
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/vanta-appimage-data
          JAVA_TOOL_OPTIONS: -Dprism.order=sw -Djava.awt.headless=false
        run: |
          mkdir -p "$XDG_DATA_HOME"
          xvfb-run -a build/packages/Vanta/bin/Vanta --capture-sidebar-screenshots build/app-image-smoke
          screenshots=(build/app-image-smoke/[0-9][0-9]-*.png)
          test "${#screenshots[@]}" -eq 13
          test -s build/app-image-smoke/index.md
          test -s build/app-image-smoke/overview.png

      - name: Smoke test Windows application image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'vanta-windows-smoke'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $env:JAVA_TOOL_OPTIONS = '-Dprism.order=sw -Djava.awt.headless=false'
          $process = Start-Process -FilePath 'build/packages/Vanta/Vanta.exe' `
            -ArgumentList '--capture-sidebar-screenshots', 'build/app-image-smoke' -PassThru
          if (!$process.WaitForExit(90000)) {
            $process.Kill()
            throw 'Vanta screenshot smoke test timed out after 90 seconds'
          }
          if ($process.ExitCode -ne 0) { throw "Vanta exited with code $($process.ExitCode)" }
          $screenshots = Get-ChildItem 'build/app-image-smoke/[0-9][0-9]-*.png' -ErrorAction SilentlyContinue
          if ($screenshots.Count -ne 13) { throw "Expected 13 screenshots, found $($screenshots.Count)" }
          if (!(Test-Path 'build/app-image-smoke/index.md')) { throw 'Missing screenshot index' }
          if (!(Test-Path 'build/app-image-smoke/overview.png')) { throw 'Missing screenshot overview' }

      - name: Smoke test macOS application bundle
        if: runner.os == 'macOS'
        env:
          JAVA_TOOL_OPTIONS: -Dprism.order=sw -Djava.awt.headless=false
        run: |
          export HOME="$RUNNER_TEMP/vanta-macos-home"
          mkdir -p "$HOME"
          build/packages/Vanta.app/Contents/MacOS/Vanta --capture-sidebar-screenshots build/app-image-smoke
          screenshots=(build/app-image-smoke/[0-9][0-9]-*.png)
          test "${#screenshots[@]}" -eq 13
          test -s build/app-image-smoke/index.md
          test -s build/app-image-smoke/overview.png

      - name: Upload platform distributions
        uses: actions/upload-artifact@v4
        with:
          name: vanta-distribution-${{ runner.os }}-${{ runner.arch }}
          # The ZIP already contains the complete jpackage image. Uploading
          # build/packages as well duplicates the entire runtime in CI artifacts.
          path: build/distributions/*
          if-no-files-found: error
          retention-days: 14


  windows-arm64-emulation:
    name: Windows 11 ARM64 — x64 emulation
    runs-on: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up x64 Java 21 for Windows emulation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          cache: gradle

      - name: Run tests and build x64 application image
        shell: pwsh
        run: .\\gradlew.bat test platformImageChecksum updaterJarChecksum

      - name: Verify emulated x64 application image
        shell: pwsh
        run: |
          $image = 'build/packages/Vanta'
          if (!(Test-Path "$image/Vanta.exe")) { throw 'Missing x64 Windows launcher' }
          if (!(Test-Path "$image/runtime/bin/java.dll")) { throw 'Missing x64 JVM runtime library' }
          if (!(Test-Path "$image/runtime/lib/modules")) { throw 'Missing bundled runtime modules' }
          if (!(Test-Path "$image/app/Vanta.cfg")) { throw 'Missing application configuration' }
          $nativeArch = $env:PROCESSOR_ARCHITEW6432
          if (!$nativeArch) { $nativeArch = $env:PROCESSOR_ARCHITECTURE }
          if ($nativeArch -ne 'ARM64') {
            throw "Expected native ARM64 runner, got $nativeArch"
          }
          $javaProperties = & java -XshowSettings:properties -version 2>&1 | Out-String
          if ($javaProperties -notmatch 'os\.arch\s*=\s*(amd64|x86_64)') {
            throw 'The test JVM is not running as x64 under emulation'
          }

      - name: Smoke test emulated Windows application image
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'vanta-arm64-smoke'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $process = Start-Process -FilePath 'build/packages/Vanta/Vanta.exe' `
            -ArgumentList '--capture-sidebar-screenshots', 'build/app-image-smoke' -PassThru
          if (!$process.WaitForExit(90000)) {
            $process.Kill()
            throw 'Vanta screenshot smoke test timed out after 90 seconds'
          }
          if ($process.ExitCode -ne 0) { throw "Vanta exited with code $($process.ExitCode)" }
          $screenshots = Get-ChildItem 'build/app-image-smoke/[0-9][0-9]-*.png' -ErrorAction SilentlyContinue
          if ($screenshots.Count -ne 13) { throw "Expected 13 screenshots, found $($screenshots.Count)" }
          if (!(Test-Path 'build/app-image-smoke/index.md')) { throw 'Missing screenshot index' }
          if (!(Test-Path 'build/app-image-smoke/overview.png')) { throw 'Missing screenshot overview' }

      - name: Upload Windows ARM64 emulation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanta-windows-arm64-x64-emulation
          # Keep the portable archive and smoke-test evidence; the archive
          # already contains the complete application image.
          path: |
            build/distributions/*
            build/app-image-smoke/*
          if-no-files-found: error
          retention-days: 14

  linux-distribution-smoke:
    name: Linux desktop smoke — ${{ matrix.distro }}
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 22.04
            image: ubuntu:22.04
          - distro: Debian 12
            image: debian:12
          - distro: Fedora (current)
            image: fedora:latest
          - distro: Arch Linux
            image: archlinux:latest
    steps:
      - name: Download Linux x64 application image
        uses: actions/download-artifact@v4
        with:
          name: vanta-distribution-Linux-X64
          path: linux-x64-artifact

      - name: Launch packaged application on target distribution
        env:
          DISTRO: ${{ matrix.distro }}
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            -e VANTA_DISTRO="$DISTRO" \
            -v "$PWD/linux-x64-artifact:/artifact:ro" \
            "$DISTRO_IMAGE" bash -s <<'CONTAINER'
          set -euo pipefail

          case "$VANTA_DISTRO" in
            "Ubuntu 22.04"|"Debian 12")
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                xvfb libgtk-3-0 libxtst6 libxi6 libxrender1 libxrandr2 \
                libxinerama1 libxxf86vm1 libgl1 libasound2 libxkbcommon0 \
                libfontconfig1 libfreetype6 libcups2
              ;;
            "Fedora (current)")
              dnf install -y \
                xorg-x11-server-Xvfb gtk3 libXtst libXi libXrender libXrandr \
                libXinerama libXxf86vm mesa-libGL alsa-lib libxkbcommon \
                fontconfig freetype cups-libs
              ;;
            "Arch Linux")
              pacman -Syu --noconfirm --needed \
                xorg-server-xvfb gtk3 libxtst libxi libxrender libxrandr \
                libxinerama libxxf86vm mesa libglvnd alsa-lib libxkbcommon \
                fontconfig freetype2 libcups
              ;;
            *)
              echo "Unknown Linux distribution: $VANTA_DISTRO"
              exit 2
              ;;
          esac

          ARCHIVE="$(find /artifact -maxdepth 1 -name 'Vanta-*-linux-x64.zip' -print -quit)"
          test -n "$ARCHIVE"
          APP=/tmp/vanta-linux-x64
          mkdir -p "$APP"
          unzip -q "$ARCHIVE" -d "$APP"
          test -x "$APP/bin/Vanta"
          test -f "$APP/lib/runtime/lib/modules"

          mkdir -p /tmp/vanta-home /tmp/vanta-xdg-data
          export HOME=/tmp/vanta-home
          export XDG_DATA_HOME=/tmp/vanta-xdg-data
          export DISPLAY=:99
          export JAVA_TOOL_OPTIONS="-Dprism.order=sw -Djava.awt.headless=false"

          Xvfb :99 -screen 0 1600x1000x24 >/tmp/vanta-xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2

          "$APP/bin/Vanta" --capture-sidebar-screenshots /tmp/vanta-distro-smoke
          screenshots=(/tmp/vanta-distro-smoke/[0-9][0-9]-*.png)
          test "${#screenshots[@]}" -eq 13
          test -s /tmp/vanta-distro-smoke/index.md
          test -s /tmp/vanta-distro-smoke/overview.png
          CONTAINER
