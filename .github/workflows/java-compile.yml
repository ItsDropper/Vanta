name: Java compile check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Compile launcher and run regression tests
        run: ./gradlew test

  windows-download-regression:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run download engine regression tests
        run: .\gradlew.bat test --tests "dev.itsdropper.vanta.launcher.instance.DownloadUtilTest" --tests "dev.itsdropper.vanta.launcher.instance.DownloadUtilIntegrationTest"
