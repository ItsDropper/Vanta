name: Cross-platform Java checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} — tests and distributions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run tests and build portable distributions (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew test distZip distTar platformAppImage
      - name: Run tests and build portable distributions (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat test distZip distTar platformAppImage
      - name: Smoke test Linux application image
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/vanta-appimage-data
          JAVA_TOOL_OPTIONS: -Dprism.order=sw -Djava.awt.headless=false
        run: |
          mkdir -p "$XDG_DATA_HOME"
          xvfb-run -a build/packages/Vanta/bin/Vanta --capture-sidebar-screenshots build/app-image-smoke
          test -s build/app-image-smoke/index.html
      - name: Upload platform distributions
        uses: actions/upload-artifact@v4
        with:
          name: vanta-distribution-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/distributions/*
            build/packages/*
          if-no-files-found: error
          retention-days: 14
