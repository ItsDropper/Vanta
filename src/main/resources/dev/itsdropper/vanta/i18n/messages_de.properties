onboarding.readyBody=Der erste sinnvolle Schritt ist das Erstellen einer Instanz. Die Launcher-Standards kannst du später in den Einstellungen ändern.
onboarding.privacyTitle=Vanta verbessern (optional)
onboarding.privacyUsage=Wähle aus, was Vanta senden darf. Nutzungsereignisse enthalten nur einen Ereignisnamen und die Launcher-Version. 
onboarding.privacyCrash=Absturzdiagnosen können eine bereinigte Ausnahmemeldung, einen Stacktrace und einen kurzen Fehlerauszug enthalten. 
