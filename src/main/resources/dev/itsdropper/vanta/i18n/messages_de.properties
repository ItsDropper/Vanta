experimental.performance.title=Vorbereitung modifizierter Starts
experimental.performance.description=Dieses Experiment speichert geparste Versionsmetadaten sowie aufgelöste Klassenpfad- und Native-Pfade zwischen. Der Cache wird ungültig, wenn sich Versionsmetadaten ändern oder eine benötigte Datei fehlt. Die Initialisierung von Minecraft, Loader oder Mods im Spielprozess wird dadurch nicht verändert.
experimental.performance.benchmarkMethod=Verwende für einen fairen Vergleich dieselbe Instanz, dieselben Mods, dieselbe Java-Laufzeit und dieselben Einstellungen. Starte mindestens dreimal mit deaktiviertem Cache und anschließend dreimal mit aktiviertem Cache. Der erste Start mit aktiviertem Cache ist ein Kaltstart. Die Vorbereitungszeit misst Vantas Metadaten- und Klassenpfadarbeit. Die Prozessstartzeit wird von der Prozesserstellung bis zur ersten vollständigen Ausgabezeile gemessen. Dies ist ein frühes Startsignal, nicht die Zeit bis zum Hauptmenü.
