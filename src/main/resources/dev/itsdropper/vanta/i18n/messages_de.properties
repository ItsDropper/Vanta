onboarding.organizationTitle=So ist Vanta organisiert
onboarding.organizationBody=Eine Instanz ist eine vollständige Minecraft-Umgebung. Getrennte Umgebungen verhindern, dass eine Konfiguration versehentlich eine andere verändert.
onboarding.instanceTip=Tipp: Verwende für jede unterschiedliche Mod-Konfiguration eine eigene Instanz. Trenne beispielsweise eine Fabric-Performance-Konfiguration von einem großen Modpack.
onboarding.accountTitle=Minecraft-Konto verbinden
