experimental.performance.description=Experimentet cachelagrar tolkade versionsmetadata och upplösta klassökvägar och native-sökvägar. Cachen ogiltigförklaras när versionsmetadata ändras eller en nödvändig fil försvinner. Det ändrar inte Minecrafts, laddarens eller moddernas initiering i spelprocessen.
experimental.performance.benchmarkMethod=Använd samma instans, moddar, Java-runtime och inställningar för en rättvis jämförelse. Starta minst tre gånger med cachen avstängd och sedan tre gånger med den påslagen. Den första starten med cachen aktiverad är kall. Mätningen omfattar Vantas förberedelsesteg, inte Minecrafts interna moddinläsning eller tiden till huvudmenyn.
