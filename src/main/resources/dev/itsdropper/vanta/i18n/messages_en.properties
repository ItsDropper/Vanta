onboarding.organizationBody=An instance is a complete Minecraft environment. Keeping environments separate prevents one setup from accidentally changing another.
onboarding.instanceTip=Tip: use one instance for each distinct modded setup. For example, keep a Fabric performance setup separate from a large modpack.
