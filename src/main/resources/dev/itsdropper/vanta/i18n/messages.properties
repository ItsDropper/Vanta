experimental.performance.title=Modded launch preparation
experimental.performance.description=This experiment caches parsed version metadata and resolved classpath/native paths. It invalidates the cache when version metadata changes or a required file disappears. It does not change Minecraft, loader or mod initialization inside the game process.
experimental.performance.benchmarkMethod=For a fair comparison, use the same instance, mods, Java runtime and settings. Run it at least three times with the cache disabled, then three times enabled. The first enabled launch is cold. Preparation measures Vanta metadata and classpath work. Process startup measures process creation to the first complete output line. It is an early startup signal, not time-to-main-menu.
