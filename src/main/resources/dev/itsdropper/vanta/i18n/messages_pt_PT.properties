experimental.performance.title=Preparação do arranque com mods
experimental.performance.description=Esta experiência guarda em cache os metadados de versão analisados e os caminhos resolvidos do classpath e das bibliotecas nativas. A cache é invalidada quando os metadados mudam ou quando desaparece um ficheiro necessário. Não altera a inicialização do Minecraft, do loader ou dos mods dentro do processo do jogo.
experimental.performance.benchmarkMethod=Para uma comparação justa, utiliza a mesma instância, os mesmos mods, o mesmo runtime Java e as mesmas definições. Inicia pelo menos três vezes com a cache desativada e depois três vezes com a cache ativada. O primeiro arranque com a cache ativada é a frio. O tempo de preparação mede o trabalho do Vanta com metadados e classpath. O arranque do processo é medido desde a sua criação até à primeira linha completa de saída. É um indicador inicial, não o tempo até ao menu principal.
