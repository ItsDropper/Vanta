onboarding.organizationTitle=Cómo se organiza Vanta
onboarding.organizationBody=Una instancia es un entorno completo de Minecraft. Mantener los entornos separados evita que una configuración cambie otra por accidente.
onboarding.instanceTip=Consejo: usa una instancia para cada configuración de mods distinta. Por ejemplo, mantén una configuración de rendimiento Fabric separada de un modpack grande.
