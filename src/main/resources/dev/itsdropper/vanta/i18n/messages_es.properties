onboarding.privacyCrash=Los diagnósticos de fallos pueden incluir un mensaje de excepción depurado, una traza de pila y un breve fragmento del error. 
onboarding.privacyWarning=Vanta filtra credenciales habituales, identificadores de cuenta, direcciones IP y rutas locales, pero la redacción automática no es perfecta. 
