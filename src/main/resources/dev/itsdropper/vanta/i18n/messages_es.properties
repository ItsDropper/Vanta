experimental.performance.title=Preparación del inicio con mods
experimental.performance.description=Este experimento almacena en caché los metadatos de versión analizados y las rutas resueltas del classpath y de las bibliotecas nativas. La caché se invalida cuando cambian los metadatos o desaparece un archivo necesario. No modifica la inicialización de Minecraft, del loader ni de los mods dentro del proceso del juego.
experimental.performance.benchmarkMethod=Para comparar correctamente, usa la misma instancia, los mismos mods, la misma versión de Java y los mismos ajustes. Inicia al menos tres veces con la caché desactivada y después tres veces activada. El primer inicio con la caché activada es en frío. Estas mediciones cubren la preparación de Vanta, no la carga interna de mods ni el tiempo hasta el menú principal.
