onboarding.welcomeTitle=Benvenuto in Vanta
onboarding.welcomeSubtitle=Un launcher Minecraft essenziale, progettato per istanze ordinate, download affidabili e controllo senza ingombri inutili.
onboarding.overview=Vanta mantiene separate le istanze Minecraft, offre un flusso di contenuti basato su Modrinth e conserva localmente la configurazione del launcher.
onboarding.organizationTitle=Come è organizzato Vanta
onboarding.organizationBody=Un'istanza è un ambiente Minecraft completo. Tenere separati gli ambienti evita che una configurazione modifichi accidentalmente un'altra.
onboarding.instanceTip=Suggerimento: usa un'istanza per ogni configurazione mod distinta. Ad esempio, tieni separata una configurazione Fabric per le prestazioni da un grande modpack.
onboarding.accountTitle=Collega il tuo account Minecraft
onboarding.accountBody=Vanta usa il tuo account Microsoft per l'autenticazione Minecraft. La password viene inserita tramite il flusso Microsoft e non viene memorizzata da questa schermata.
