onboarding.readyBody=La prima azione utile è creare un'istanza. Puoi sempre modificare in seguito le impostazioni predefinite del launcher.
onboarding.privacyTitle=Aiuta a migliorare Vanta (facoltativo)
onboarding.privacyUsage=Scegli cosa può inviare Vanta. Gli eventi di utilizzo contengono solo il nome di un evento e la versione del launcher. 
onboarding.privacyCrash=La diagnostica degli arresti anomali può includere un messaggio di eccezione ripulito, una traccia dello stack e un breve estratto dell'errore. 
onboarding.privacyWarning=Vanta filtra credenziali comuni, identificatori account, indirizzi IP e percorsi locali, ma la redazione automatica non è perfetta. 
onboarding.privacyNote=La diagnostica degli arresti anomali e le statistiche di utilizzo sono opzioni separate, disattivate per impostazione predefinita e modificabili in seguito nelle Impostazioni.
