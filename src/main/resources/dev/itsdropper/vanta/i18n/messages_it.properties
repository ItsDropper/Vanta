experimental.performance.title=Preparazione dell’avvio moddato
experimental.performance.description=Questo esperimento memorizza nella cache i metadati di versione analizzati e i percorsi risolti del classpath e delle librerie native. La cache viene invalidata quando cambiano i metadati o manca un file necessario. Non modifica l’inizializzazione di Minecraft, del loader o delle mod nel processo di gioco.
experimental.performance.benchmarkMethod=Per un confronto corretto, usa la stessa istanza, le stesse mod, lo stesso runtime Java e le stesse impostazioni. Avvia almeno tre volte con la cache disattivata e poi tre volte con la cache attivata. Il primo avvio con la cache attivata è a freddo. Queste misurazioni coprono la preparazione di Vanta, non il caricamento interno delle mod né il tempo necessario per raggiungere il menu principale.
