experimental.performance.title=Voorbereiding van modded starten
experimental.performance.description=Dit experiment bewaart geparseerde versiegegevens en opgeloste classpath- en native-paden in de cache. De cache wordt ongeldig zodra versiegegevens veranderen of een vereist bestand ontbreekt. Dit verandert niets aan de initialisatie van Minecraft, de loader of mods in het gameproces.
experimental.performance.benchmarkMethod=Gebruik voor een eerlijke vergelijking dezelfde instantie, mods, Java-runtime en instellingen. Start minstens drie keer met de cache uitgeschakeld en daarna drie keer met de cache ingeschakeld. De eerste start met ingeschakelde cache is koud. De voorbereidingstijd meet Vanta’s metadata- en classpathwerk. De processtarttijd loopt vanaf het aanmaken van het proces tot de eerste volledige uitvoerregel. Dit is een vroege startindicator, niet de tijd tot het hoofdmenu.
