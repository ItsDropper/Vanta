plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'dev.itsdropper.vanta'
version = providers.gradleProperty('vantaVersion').getOrElse('1.4.2')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def hostIsX64 = ['amd64', 'x86_64', 'x86-64', 'x64'].contains(
        System.getProperty('os.arch', '').toLowerCase(java.util.Locale.ROOT))

def dependencyHostOs = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT)
def sqliteNativeClassifier = dependencyHostOs.contains('windows') ? 'natives-windows'
        : ((dependencyHostOs.contains('mac') || dependencyHostOs.contains('darwin'))
        ? 'natives-mac' : 'natives-linux')

application {
    mainClass = 'dev.itsdropper.vanta.Main'
    // Protect Vanta's own bundled JVM as well as Minecraft child processes.
    applicationDefaultJvmArgs = hostIsX64 ? ['-XX:-UseBASE64Intrinsics'] : []
}

processResources {
    filesMatching('version.properties') {
        expand(
                version: project.version
        )
    }
}

javafx {
    version = '21'
    modules = [
            'javafx.controls'
    ]
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'

    // JSON: Gson is shared with MinecraftAuth; Vanta uses its own narrow JSON API.
    implementation 'com.google.code.gson:gson:2.11.0'

    // Parse Forge and NeoForge dependency metadata with a standards-compliant TOML parser.
    implementation 'org.tomlj:tomlj:1.1.1'

    // Read Modrinth App's local SQLite database without modifying it.
    // Keep the small JDBC classes jar and package only this build host's native SQLite binaries.
    implementation 'org.xerial:sqlite-jdbc:3.54.1.0:without-natives'
    runtimeOnly "org.xerial:sqlite-jdbc:3.54.1.0:${sqliteNativeClassifier}"

    // Minecraft authentication
    implementation 'net.raphimc:MinecraftAuth:4.1.2'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.13'

    // Windows credential storage / native access
    implementation 'net.java.dev.jna:jna:5.16.0'

    // WebP image support
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'

    // Markdown
    implementation 'com.vladsch.flexmark:flexmark:0.64.8'

    // Discord Rich Presence
    implementation 'io.github.cdagaming:DiscordIPC:0.11.3'

    // SVG support
    implementation 'org.apache.xmlgraphics:batik-transcoder:1.18'
}

tasks.named('test') {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier = 'all'

    // Do NOT use minimize().
    // MinecraftAuth, Gson, JNA and JavaFX-related code
    // can rely on reflection/runtime discovery.
}

tasks.register('updaterJar', Jar) {
    dependsOn tasks.named('classes')

    archiveBaseName = 'VantaUpdater'
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('updater')

    from sourceSets.main.output

    include 'dev/itsdropper/vanta/launcher/update/UpdaterMain.class'
    include 'dev/itsdropper/vanta/launcher/update/UpdaterMain$*.class'
    include 'dev/itsdropper/vanta/launcher/update/UpdateTransaction.class'
    include 'dev/itsdropper/vanta/launcher/update/UpdateTransaction$*.class'
    include 'dev/itsdropper/vanta/launcher/update/UpdaterWorkspaceCleanup.class'
    // UpdaterMain calls ApplicationLocator; include its nested Layout enum too.
    include 'dev/itsdropper/vanta/launcher/update/ApplicationLocator.class'
    include 'dev/itsdropper/vanta/launcher/update/ApplicationLocator$*.class'
    include 'dev/itsdropper/vanta/launcher/Platform.class'
    include 'dev/itsdropper/vanta/launcher/Platform$*.class'

    manifest {
        attributes(
                'Main-Class': 'dev.itsdropper.vanta.launcher.update.UpdaterMain'
        )
    }
}


tasks.register('updaterJarChecksum') {
    dependsOn tasks.named('updaterJar')
    doLast {
        def archive = tasks.named('updaterJar').get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def checksum = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        new File(archive.parentFile, archive.name + '.sha256').text =
                "${checksum}  ${archive.name}${System.lineSeparator()}"
    }
}


/**
 * Produce the native icon containers required by jpackage from the canonical
 * Vanta PNG artwork. Keep conversion in the build so all release platforms
 * use the same checked-in source images.
 */
tasks.register('preparePlatformIcon') {
    def icon64 = file('src/main/resources/images/vanta-icon-64.png')
    def iconFull = file('src/main/resources/images/vanta-icon.png')
    def iconOutput = layout.buildDirectory.dir('jpackage/icons')
    inputs.files(icon64, iconFull)
    outputs.dir(iconOutput)

    doLast {
        if (!icon64.isFile() || !iconFull.isFile()) {
            throw new GradleException('The canonical Vanta release icon PNG files are missing.')
        }
        def output = iconOutput.get().asFile
        output.mkdirs()

        def readPng = { File source ->
            def image = javax.imageio.ImageIO.read(source)
            if (image == null) throw new GradleException("Cannot decode Vanta icon: ${source}")
            image
        }
        def encodePng = { java.awt.image.BufferedImage image ->
            def bytes = new ByteArrayOutputStream()
            if (!javax.imageio.ImageIO.write(image, 'png', bytes)) {
                throw new GradleException('The JDK PNG encoder is unavailable.')
            }
            bytes.toByteArray()
        }
        def resizePng = { java.awt.image.BufferedImage source, int size ->
            def image = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def graphics = image.createGraphics()
            try {
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                        java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                        java.awt.RenderingHints.VALUE_RENDER_QUALITY)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,
                        java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
                graphics.drawImage(source, 0, 0, size, size, null)
            } finally {
                graphics.dispose()
            }
            image
        }

        // A PNG-compressed ICO entry is supported by modern Windows shells and
        // preserves the alpha channel without requiring external image tools.
        def windowsPng = encodePng(readPng(icon64))
        def ico = new ByteArrayOutputStream()
        def icoData = new DataOutputStream(ico)
        icoData.writeShort(0)       // reserved
        icoData.writeShort(1)       // icon type
        icoData.writeShort(1)       // image count
        icoData.writeByte(64)       // width
        icoData.writeByte(64)       // height
        icoData.writeByte(0)        // palette
        icoData.writeByte(0)        // reserved
        icoData.writeShort(1)       // color planes
        icoData.writeShort(32)      // bits per pixel
        icoData.writeInt(windowsPng.length)
        icoData.writeInt(22)        // first image follows the 6+16 byte header
        icoData.write(windowsPng)
        icoData.close()
        new File(output, 'vanta.ico').bytes = ico.toByteArray()

        // ICNS uses PNG chunks for modern macOS icon sizes.
        def macSource = readPng(iconFull)
        def iconChunks = new ByteArrayOutputStream()
        def chunkData = new DataOutputStream(iconChunks)
        [
                [16, 'icp4'], [32, 'icp5'], [64, 'icp6'],
                [128, 'ic07'], [256, 'ic08'], [512, 'ic09'], [1024, 'ic10']
        ].each { entry ->
            def png = encodePng(resizePng(macSource, entry[0] as int))
            chunkData.write(entry[1].getBytes('US-ASCII'))
            chunkData.writeInt(png.length + 8)
            chunkData.write(png)
        }
        chunkData.close()
        def chunks = iconChunks.toByteArray()
        def icns = new ByteArrayOutputStream()
        def icnsData = new DataOutputStream(icns)
        icnsData.write('icns'.getBytes('US-ASCII'))
        icnsData.writeInt(chunks.length + 8)
        icnsData.write(chunks)
        icnsData.close()
        new File(output, 'vanta.icns').bytes = icns.toByteArray()
    }
}

tasks.register('platformAppImage', Exec) {\n    dependsOn tasks.named('installDist'), tasks.named('updaterJar'), tasks.named('preparePlatformIcon')\n
    def packageName = 'Vanta'
    // jpackage accepts only one to three numeric components. Keep the full
    // project version for archives/resources while passing a valid native
    // application version (for example, 1.3.2git -> 1.3.2).
    def jpackageVersion = project.version.toString().find(/^\d+(?:\.\d+){0,2}/)
    if (jpackageVersion == null) {
        throw new GradleException("Vanta version '${project.version}' cannot be represented as a jpackage version.")
    }
    def packageInput = layout.buildDirectory.dir("install/${project.name}/lib")
    def packageOutput = layout.buildDirectory.dir('packages')
    def javafxModuleDirectory = layout.buildDirectory.dir('jpackage/javafx-modules')
    def javafxModuleJars = configurations.runtimeClasspath.files.findAll {
        it.name.startsWith('javafx-') && it.name.endsWith('.jar')
    }
    def mainJar = tasks.named('jar').get().archiveFileName.get()
    def javaHome = System.getProperty('java.home')
    def hostOs = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT)
    def windowsHost = hostOs.contains('windows')
    def macHost = hostOs.contains('mac') || hostOs.contains('darwin')
    def linuxHost = hostOs.contains('linux')
    def jpackageExecutable = windowsHost
            ? file("${javaHome}/bin/jpackage.exe")
            : file("${javaHome}/bin/jpackage")

    // Track the generated image so diagnostic tasks in later Gradle invocations
    // reuse the completed package instead of invoking jpackage over an existing
    // destination. Declare the actual inputs so changed application/runtime
    // contents correctly invalidate the image.
    inputs.dir(packageInput)
    inputs.file(tasks.named('updaterJar').flatMap { it.archiveFile })
    inputs.files(javafxModuleJars)
    inputs.property('jpackageVersion', jpackageVersion)
    inputs.property('javaHome', javaHome)
    outputs.dir(packageOutput)

    doFirst {
        if (!windowsHost && !macHost && !linuxHost) {
            throw new GradleException("Unsupported jpackage host operating system: ${hostOs}")
        }
        if (!jpackageExecutable.isFile()) {
            throw new GradleException("jpackage is required to create the platform application image.")
        }
        // jpackage refuses to overwrite an existing application image. Gradle
        // runs this action only when the declared inputs invalidate the output.
        delete(packageOutput)
        packageOutput.get().asFile.mkdirs()
        javafxModuleDirectory.get().asFile.mkdirs()
        copy {
            from javafxModuleJars
            into javafxModuleDirectory.get().asFile
        }
        def modulePath = [
                file("${javaHome}/jmods").absolutePath,
                javafxModuleDirectory.get().asFile.absolutePath
        ].join(File.pathSeparator)
        def jpackageArguments = [
                jpackageExecutable.absolutePath,
                '--type', 'app-image',
                '--name', packageName,
                '--app-version', jpackageVersion,
                '--vendor', 'ItsDropper',
                '--icon', (windowsHost
                        ? file("${layout.buildDirectory.get().asFile}/jpackage/icons/vanta.ico")
                        : (macHost
                        ? file("${layout.buildDirectory.get().asFile}/jpackage/icons/vanta.icns")
                        : file('src/main/resources/images/vanta-icon.png'))).absolutePath,
                '--input', packageInput.get().asFile.absolutePath,
                '--main-jar', mainJar,
                '--main-class', application.mainClass.get(),
                '--module-path', modulePath,
                // Keep the bundled runtime to modules Vanta actually uses.
                // ALL-MODULE-PATH would pull in every JDK module and inflate
                // each platform image unnecessarily.
                '--add-modules', [
                        'java.base',
                        'java.desktop',
                        'java.logging',
                        'java.management',
                        'java.net.http',
                        'java.sql',
                        'java.transaction.xa',
                        'java.xml',
                        'jdk.charsets',
                        'jdk.crypto.ec',
                        'jdk.localedata',
                        'jdk.unsupported',
                        'javafx.controls'
                ].join(','),
                '--jlink-options',
                '--strip-debug --no-man-pages --no-header-files --compress=2'
        ]
        if (hostIsX64) {
            jpackageArguments.addAll(['--java-options', '-XX:-UseBASE64Intrinsics'])
        }
        jpackageArguments.addAll(['--dest', packageOutput.get().asFile.absolutePath])
        commandLine(jpackageArguments)
    }

    doLast {
        File imageRoot = packageOutput.get().asFile.toPath().resolve(macHost ? 'Vanta.app' : 'Vanta').toFile()
        File updaterDirectory = macHost
                ? new File(imageRoot, 'Contents/app/updater')
                : new File(imageRoot, 'updater')
        updaterDirectory.mkdirs()
        copy {
            from tasks.named('updaterJar').get().archiveFile.get().asFile
            into updaterDirectory
            rename { 'VantaUpdater.jar' }
        }
        File bundledUpdater = new File(updaterDirectory, 'VantaUpdater.jar')
        if (!bundledUpdater.isFile() || bundledUpdater.length() == 0) {
            throw new GradleException('The platform image is missing updater/VantaUpdater.jar.')
        }
    }
}

def releaseHostOs = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT)
def releaseHostArch = System.getProperty('os.arch', '').toLowerCase(java.util.Locale.ROOT)
def releaseWindows = releaseHostOs.contains('windows')
def releaseMac = releaseHostOs.contains('mac') || releaseHostOs.contains('darwin')
def releaseLinux = releaseHostOs.contains('linux')
def releaseArch = (releaseHostArch in ['amd64', 'x86_64', 'x86-64', 'x64'])
        ? 'x64'
        : ((releaseHostArch in ['aarch64', 'arm64']) ? 'aarch64' : null)
if (releaseArch == null) {
    throw new GradleException("Unsupported release CPU architecture: ${releaseHostArch}")
}
if (!releaseWindows && !releaseMac && !releaseLinux) {
    throw new GradleException("Unsupported release host operating system: ${releaseHostOs}")
}
if (releaseWindows && releaseArch != 'x64') {
    throw new GradleException("Windows application images are currently supported on x64 only.")
}
def releasePlatformId = releaseWindows ? "windows-${releaseArch}"
        : (releaseMac ? "macos-${releaseArch}" : "linux-${releaseArch}")
def releaseImageName = releaseMac ? 'Vanta.app' : 'Vanta'

tasks.register('platformImageZip', Zip) {
    dependsOn tasks.named('platformAppImage')
    archiveFileName = "Vanta-${project.version}-${releasePlatformId}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    // Archive the image contents at the ZIP root. UpdaterMain extracts
    // directly into the staging directory and verifies that directory as
    // the application image (including the Vanta.app Contents/ tree on macOS).
    from(layout.buildDirectory.dir("packages/${releaseImageName}"))
    doLast {
        def archive = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            def updaterPath = releaseMac ? 'Contents/app/updater/VantaUpdater.jar' : 'updater/VantaUpdater.jar'
            if (archive.getEntry(updaterPath) == null) {
                throw new GradleException("Platform release archive is missing ${updaterPath}.")
            }
        } finally {
            archive.close()
        }
    }
}

tasks.register('platformImageChecksum') {
    dependsOn tasks.named('platformImageZip')
    doLast {
        def archive = tasks.named('platformImageZip').get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def checksum = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        new File(archive.parentFile, archive.name + '.sha256').text =
                "${checksum}  ${archive.name}${System.lineSeparator()}"
    }
}

/** Reports the largest runtime JARs and packaged image sections for size regressions. */
tasks.register('runtimeFootprint') {
    dependsOn tasks.named('platformAppImage')
    doLast {
        def bytesOf = { File file ->
            if (!file.exists()) return 0L
            if (file.isFile()) return file.length()
            long total = 0L
            file.eachFileRecurse { child -> if (child.isFile()) total += child.length() }
            return total
        }
        println 'VANTA RUNTIME DEPENDENCIES (largest first)'
        configurations.runtimeClasspath.files
                .sort { a, b -> bytesOf(b) <=> bytesOf(a) }
                .each { file -> println String.format('%8.2f MiB  %s', bytesOf(file) / 1048576.0, file.name) }
        def imageName = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT).contains('mac')
                ? 'Vanta.app' : 'Vanta'
        File image = layout.buildDirectory.dir("packages/${imageName}").get().asFile
        if (image.isDirectory()) {
            println 'VANTA APPLICATION IMAGE (top-level)'
            image.listFiles().sort { a, b -> bytesOf(b) <=> bytesOf(a) }
                    .each { file -> println String.format('%8.2f MiB  %s', bytesOf(file) / 1048576.0, file.name) }
            println String.format('TOTAL IMAGE: %.2f MiB', bytesOf(image) / 1048576.0)
        }
    }
}

