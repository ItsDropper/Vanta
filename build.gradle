plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'org.example'
version = '1.1.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.raphimc.net/repository/maven-releases/'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'org.example.Main'
}

processResources {
    filesMatching('version.properties') {
        expand(
                version: project.version
        )
    }
}

javafx {
    version = '21'
    modules = [
            'javafx.controls'
    ]
}

dependencies {
    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Minecraft authentication
    implementation 'net.raphimc:MinecraftAuth:4.1.0'

    // Windows credential storage / native access
    implementation 'net.java.dev.jna:jna:5.16.0'
    implementation 'net.java.dev.jna:jna-platform:5.16.0'

    // WebP image support
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
    implementation 'com.twelvemonkeys.imageio:imageio-core:3.12.0'

    // Markdown
    implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'

    // SVG support
    implementation 'org.apache.xmlgraphics:batik-transcoder:1.18'
    implementation 'org.apache.xmlgraphics:batik-codec:1.18'
}

shadowJar {
    archiveClassifier = 'all'

    // Do NOT use minimize().
    // MinecraftAuth, Jackson, JNA and JavaFX-related code
    // can rely on reflection/runtime discovery.
}

tasks.register('updaterJar', Jar) {
    dependsOn tasks.named('classes')

    archiveBaseName = 'VantaUpdater'
    archiveVersion = project.version.toString()

    destinationDirectory = layout.buildDirectory.dir('updater')

    from sourceSets.main.output

    include 'org/example/launcher/update/UpdaterMain.class'
    include 'org/example/launcher/update/UpdaterMain$*.class'

    manifest {
        attributes(
                'Main-Class': 'org.example.launcher.update.UpdaterMain'
        )
    }
}