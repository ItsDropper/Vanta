plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'dev.itsdropper.vanta'
version = providers.gradleProperty('vantaVersion').getOrElse('1.3.2git')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'dev.itsdropper.vanta.Main'
}

processResources {
    filesMatching('version.properties') {
        expand(
                version: project.version
        )
    }
}

javafx {
    version = '21'
    modules = [
            'javafx.controls'
    ]
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'

    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Minecraft authentication
    implementation 'net.raphimc:MinecraftAuth:4.1.0'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.13'

    // Windows credential storage / native access
    implementation 'net.java.dev.jna:jna:5.16.0'
    implementation 'net.java.dev.jna:jna-platform:5.16.0'

    // WebP image support
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
    implementation 'com.twelvemonkeys.imageio:imageio-core:3.12.0'

    // Markdown
    implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'

    // Discord Rich Presence
    implementation 'io.github.cdagaming:DiscordIPC:0.11.3'

    // SVG support
    implementation 'org.apache.xmlgraphics:batik-transcoder:1.18'
    implementation 'org.apache.xmlgraphics:batik-codec:1.18'
}

tasks.named('test') {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier = 'all'

    // Do NOT use minimize().
    // MinecraftAuth, Jackson, JNA and JavaFX-related code
    // can rely on reflection/runtime discovery.
}

tasks.register('updaterJar', Jar) {
    dependsOn tasks.named('classes')

    archiveBaseName = 'VantaUpdater'
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('updater')

    from sourceSets.main.output

    include 'dev/itsdropper/vanta/launcher/update/UpdaterMain.class'
    include 'dev/itsdropper/vanta/launcher/update/UpdaterMain$*.class'
    // UpdaterMain calls ApplicationLocator; include its nested Layout enum too.
    include 'dev/itsdropper/vanta/launcher/update/ApplicationLocator.class'
    include 'dev/itsdropper/vanta/launcher/update/ApplicationLocator$*.class'

    manifest {
        attributes(
                'Main-Class': 'dev.itsdropper.vanta.launcher.update.UpdaterMain'
        )
    }
}


tasks.register('platformAppImage', Exec) {
    dependsOn tasks.named('installDist')

    def packageName = 'Vanta'
    def packageInput = layout.buildDirectory.dir("install/${project.name}/lib")
    def packageOutput = layout.buildDirectory.dir('packages')
    def javafxModuleDirectory = layout.buildDirectory.dir('jpackage/javafx-modules')
    def javafxModuleJars = configurations.runtimeClasspath.files.findAll {
        it.name.startsWith('javafx-') && it.name.endsWith('.jar')
    }
    def mainJar = tasks.named('jar').get().archiveFileName.get()
    def javaHome = System.getProperty('java.home')
    def hostOs = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT)
    def windowsHost = hostOs.contains('windows')
    def macHost = hostOs.contains('mac') || hostOs.contains('darwin')
    def linuxHost = hostOs.contains('linux')
    def jpackageExecutable = windowsHost
            ? file("${javaHome}/bin/jpackage.exe")
            : file("${javaHome}/bin/jpackage")

    doFirst {
        if (!windowsHost && !macHost && !linuxHost) {
            throw new GradleException("Unsupported jpackage host operating system: ${hostOs}")
        }
        if (!jpackageExecutable.isFile()) {
            throw new GradleException("jpackage is required to create the platform application image.")
        }
        packageOutput.get().asFile.mkdirs()
        javafxModuleDirectory.get().asFile.mkdirs()
        copy {
            from javafxModuleJars
            into javafxModuleDirectory.get().asFile
        }
        def modulePath = [
                file("${javaHome}/jmods").absolutePath,
                javafxModuleDirectory.get().asFile.absolutePath
        ].join(File.pathSeparator)
        commandLine(
                jpackageExecutable.absolutePath,
                '--type', 'app-image',
                '--name', packageName,
                '--app-version', project.version.toString(),
                '--vendor', 'ItsDropper',
                '--input', packageInput.get().asFile.absolutePath,
                '--main-jar', mainJar,
                '--main-class', application.mainClass.get(),
                '--module-path', modulePath,
                '--add-modules', 'ALL-MODULE-PATH',
                '--java-options', '--add-modules=ALL-MODULE-PATH',
                '--dest', packageOutput.get().asFile.absolutePath
        )
    }

}

def releaseHostOs = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT)
def releaseHostArch = System.getProperty('os.arch', '').toLowerCase(java.util.Locale.ROOT)
def releaseWindows = releaseHostOs.contains('windows')
def releaseMac = releaseHostOs.contains('mac') || releaseHostOs.contains('darwin')
def releaseLinux = releaseHostOs.contains('linux')
def releaseArch = (releaseHostArch in ['amd64', 'x86_64', 'x86-64', 'x64'])
        ? 'x64'
        : ((releaseHostArch in ['aarch64', 'arm64']) ? 'aarch64' : null)
if (releaseArch == null) {
    throw new GradleException("Unsupported release CPU architecture: ${releaseHostArch}")
}
if (!releaseWindows && !releaseMac && !releaseLinux) {
    throw new GradleException("Unsupported release host operating system: ${releaseHostOs}")
}
if (releaseWindows && releaseArch != 'x64') {
    throw new GradleException("Windows application images are currently supported on x64 only.")
}
def releasePlatformId = releaseWindows ? "windows-${releaseArch}"
        : (releaseMac ? "macos-${releaseArch}" : "linux-${releaseArch}")
def releaseImageName = releaseMac ? 'Vanta.app' : 'Vanta'

tasks.register('platformImageZip', Zip) {
    dependsOn tasks.named('platformAppImage')
    archiveFileName = "Vanta-${project.version}-${releasePlatformId}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    // Archive the image contents at the ZIP root. UpdaterMain extracts
    // directly into the staging directory and verifies that directory as
    // the application image (including the Vanta.app Contents/ tree on macOS).
    from(layout.buildDirectory.dir("packages/${releaseImageName}"))
}

tasks.register('platformImageChecksum') {
    dependsOn tasks.named('platformImageZip')
    doLast {
        def archive = tasks.named('platformImageZip').get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def checksum = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        new File(archive.parentFile, archive.name + '.sha256').text =
                "${checksum}  ${archive.name}${System.lineSeparator()}"
    }
}
